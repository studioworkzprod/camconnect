kind = "mobile"
previewPath = "/"
title = "Canon DSLR Companion"
description = "An Android companion app for connecting to a Canon EOS 6D, triggering a shot, and making captured images available to other apps on the local network through a PWA-friendly bridge. Designed to add support for more camera models over time."
version = "1.0.0"
id = "artifacts/canon-companion"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24049

[services.development]
run = "pnpm --filter @workspace/canon-companion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/canon-companion", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/canon-companion", "run", "serve" ]

[services.env]
PORT = "24049"
BASE_PATH = "/"
